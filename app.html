<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4f3ec">
<title>Summer Body</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Summer Body — thème clair pastel (menthe / pêche), cartes arrondies, nav flottante */
:root{
  --bg1:#e4f3ec; --bg2:#fdeee5;
  --card:rgba(255,255,255,.78); --card-solid:#ffffff; --card2:#f2f6f4; --line:rgba(29,43,40,.08);
  --text:#1d2b28; --muted:#7c8b87;
  --teal:#2bb39a; --teal-d:#1f927e; --teal-soft:#d9f2ea;
  --peach:#ff8a6b; --peach-d:#f06b4b; --peach-soft:#ffe4d9;
  --blue-soft:#d5eaf4; --yellow-soft:#fbefc2; --green-soft:#e2f0cf; --lilac-soft:#ebe4f7;
  --good:#2bb39a; --bad:#e5534b;
  --accent:var(--teal); --accent2:var(--peach);
  --shadow:0 10px 30px rgba(38,78,68,.08), 0 2px 6px rgba(38,78,68,.04);
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(160deg,var(--bg1) 0%,#f3f4ee 50%,var(--bg2) 100%) fixed;min-height:100%}
body{margin:0;color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));min-height:100vh}

/* En-tête */
#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(228,243,236,.95),rgba(228,243,236,.75));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#7fd6c3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(43,179,154,.3)}
#topbar .ttl{flex:1;min-width:0}
#topbar h1{margin:0;font-size:19px;font-weight:750;letter-spacing:-.2px}
#date-label{color:var(--muted);font-size:13px;text-transform:capitalize}
#topbar .bell{width:44px;height:44px;border-radius:50%;background:var(--card-solid);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:0;color:var(--text)}
main{padding:4px 16px 20px;max-width:640px;margin:0 auto}

/* Barre de navigation flottante */
#tabs{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;background:#1d2b28;border-radius:32px;padding:7px;box-shadow:0 12px 30px rgba(29,43,40,.28);width:min(92vw,400px)}
#tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.55);height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:650;transition:all .25s}
#tabs button svg{width:22px;height:22px;flex-shrink:0}
#tabs button .lbl{display:none}
#tabs button.active{background:#fff;color:var(--text);flex:2.2}
#tabs button.active .lbl{display:inline}

/* Cartes */
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);padding:18px;margin:14px 0;border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.1px}
.card h3{margin:0 0 6px;font-size:15px}
.card.mint{background:var(--teal-soft)} .card.peach{background:var(--peach-soft)} .card.blue{background:var(--blue-soft)}
.card.yellow{background:var(--yellow-soft)} .card.green{background:var(--green-soft)} .card.lilac{background:var(--lilac-soft)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 6px;font-weight:700;font-size:16px}
.sec-title a,.sec-title button{font-size:13px;color:var(--teal-d);font-weight:600;background:none;border:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Accueil */
.hello{margin:6px 4px 2px}
.hello .h{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hello .s{color:var(--muted);font-size:14px;margin-top:4px}
.progress-card{display:flex;gap:18px;align-items:center}
.ring{position:relative;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .ring-lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ring-lbl b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.ring .ring-lbl span{font-size:11px;color:var(--muted)}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .li i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend .li span{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .li b{font-weight:700}
.week-bars{display:flex;justify-content:space-between;align-items:flex-end;height:110px;gap:8px;padding-top:6px}
.week-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.week-bars .track{flex:1;width:14px;background:rgba(43,179,154,.12);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden;position:relative}
.week-bars .fill{width:100%;background:linear-gradient(180deg,#7fd6c3,var(--teal));border-radius:10px}
.week-bars .col.today .fill{background:linear-gradient(180deg,#ffb39e,var(--peach))}
.week-bars .d{font-size:11px;color:var(--muted);font-weight:600;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.week-bars .col.today .d{background:var(--text);color:#fff}
.week-bars .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.week-bars .dot.on{background:var(--peach)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{border:0;border-radius:20px;padding:14px;display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;font-weight:650;color:var(--text);box-shadow:var(--shadow);background:var(--card-solid)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qa .ic svg{width:20px;height:20px}
.streak-card{position:relative;overflow:hidden}
.streak-card .big{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.75);font-size:12px;font-weight:700}
.quote{font-size:15px;font-weight:650;margin-top:12px;line-height:1.4}
.streak-dots{display:flex;gap:6px;margin-top:14px}
.streak-dots span{flex:1;height:32px;border-radius:11px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.streak-dots span.on{background:var(--peach);color:#fff}
.gauge-wrap{display:flex;align-items:center;gap:14px}
.gauge-wrap .gtxt{flex:1}
.gauge-wrap .gtxt .big{font-size:32px;font-weight:800;letter-spacing:-.8px}

.stat{background:var(--card-solid);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.4px}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}

.bar{height:10px;background:rgba(29,43,40,.07);border-radius:99px;overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),#ffb39e);border-radius:99px;transition:width .6s}
.bar.teal > i{background:linear-gradient(90deg,var(--teal),#7fd6c3)}

/* Boutons */
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font-size:15px;font-weight:700;background:var(--card-solid);color:var(--text);box-shadow:0 2px 6px rgba(29,43,40,.06)}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px rgba(43,179,154,.3)}
.btn.coral{background:var(--peach);color:#fff;box-shadow:0 8px 18px rgba(255,138,107,.3)}
.btn.ghost{background:transparent;border:1.5px solid rgba(29,43,40,.12);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid rgba(229,83,75,.3);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.round{width:42px;height:42px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:4;width:58px;height:58px;border-radius:50%;border:0;background:var(--peach);color:#fff;font-size:30px;font-weight:500;box-shadow:0 10px 24px rgba(255,138,107,.4)}

label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,textarea,select{width:100%;background:var(--card-solid);border:1.5px solid rgba(29,43,40,.08);color:var(--text);border-radius:14px;padding:12px 13px;font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,179,154,.15)}

/* Repas */
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 6px 6px;font-weight:700;text-transform:capitalize}
.meal{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;background:var(--card-solid);border-radius:20px;margin:10px 0;box-shadow:var(--shadow)}
.meal img,.thumb-ph{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--peach-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.meal .info{flex:1;min-width:0}
.meal .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.meal .check{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.meal .check.off{background:transparent;border:1.5px solid rgba(29,43,40,.15);color:var(--muted)}
.kcal{font-weight:750;color:var(--peach-d)}
.pending{color:var(--muted);font-style:italic;font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--muted);margin:2px 4px 2px 0;font-weight:600}
.chip.good{color:var(--teal-d);background:var(--teal-soft)} .chip.acc{color:var(--peach-d);background:var(--peach-soft)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro{background:var(--card-solid);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.macro .t{font-size:12px;color:var(--muted);font-weight:600}
.macro .v{font-size:18px;font-weight:800}
.photo-preview{width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin-top:8px;background:var(--card2)}

.seg{display:flex;background:rgba(255,255,255,.6);border-radius:18px;padding:5px;margin:6px 0 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:14px;font-size:14px;font-weight:700}
.seg button.on{background:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(43,179,154,.28)}

/* Feuille (bottom sheet) */
#sheet-backdrop{position:fixed;inset:0;background:rgba(29,43,40,.35);backdrop-filter:blur(3px);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fbfcfb;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:12px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(29,43,40,.15)}
#sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:rgba(29,43,40,.15);margin:0 auto 14px}
#sheet h2{margin:0 0 6px;font-size:20px;font-weight:800}
#sheet .card{backdrop-filter:none}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:var(--text);color:#fff;padding:11px 18px;border-radius:16px;z-index:30;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(29,43,40,.3);max-width:90%}

/* Séances */
.wk-card{position:relative;border-radius:var(--r);padding:20px;margin:12px 0;overflow:hidden;min-height:118px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
.wk-card .nm{font-size:19px;font-weight:800;letter-spacing:-.3px;max-width:62%;line-height:1.2}
.wk-card .meta{font-size:13px;color:rgba(29,43,40,.6);margin-top:4px;max-width:62%}
.wk-card .art{position:absolute;right:-6px;bottom:-8px;width:130px;height:130px;opacity:.95}
.wk-card .go{margin-top:12px;width:40px;height:40px;border-radius:50%;background:var(--text);color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.wk-card .tag{position:absolute;top:16px;right:16px}
.ex{background:var(--card-solid);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-head b{font-size:16px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.set .n{color:var(--muted);font-size:13px;text-align:center;font-weight:700}
.set input{padding:10px 8px;text-align:center;background:var(--card2);border-color:transparent}
.set .ok{height:44px;border-radius:14px;border:1.5px solid rgba(29,43,40,.1);background:#fff;color:var(--muted);font-size:18px}
.set .ok.done{background:var(--teal);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(43,179,154,.3)}
.prev{font-size:12px;color:var(--muted);margin-top:4px}
.timer{position:sticky;top:76px;z-index:3;background:var(--text);color:#fff;border-radius:20px;padding:12px 16px;font-weight:750;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;box-shadow:0 10px 24px rgba(29,43,40,.25)}
.timer .btn{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.pr{color:var(--peach-d);font-weight:800}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.list-row:last-child{border-bottom:0}
.icn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}

.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
svg.chart{width:100%;height:auto;display:block}
pre.code{background:var(--card2);padding:12px;border-radius:14px;font-size:12px;overflow:auto;white-space:pre-wrap}
details summary{cursor:pointer}

/* Chat nutrition */
#chat{display:flex;flex-direction:column;gap:9px;padding-bottom:150px}
.msg{max-width:84%;padding:11px 14px;border-radius:20px;line-height:1.45;font-size:15px;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 16px rgba(43,179,154,.25)}
.msg.assistant{align-self:flex-start;background:var(--card-solid);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg img{display:block;width:100%;max-width:240px;border-radius:14px;margin-bottom:7px}
.logged{align-self:flex-start;font-size:13px;background:var(--teal-soft);color:var(--teal-d);padding:8px 12px;border-radius:14px;max-width:90%;font-weight:600}
.logged b{color:var(--text);font-weight:700}
.typing{display:flex;gap:5px;padding:15px 17px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
#composer{position:fixed;left:50%;transform:translateX(-50%);width:min(94vw,600px);bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;padding:8px;box-shadow:0 10px 30px rgba(29,43,40,.14)}
#composer textarea{min-height:44px;height:44px;max-height:120px;padding:11px 12px;resize:none;flex:1;border:0;background:var(--card2)}
#composer .btn{height:44px;min-width:44px;padding:0 12px;font-size:18px;border-radius:16px}
#c-prevwrap{position:relative;display:inline-block;margin:2px 0 8px 4px}
#c-prevwrap[hidden]{display:none}
#c-prev{height:70px;border-radius:12px;display:block}
#c-rm{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--text);color:#fff;font-size:15px}
html,body{overflow-x:hidden}
.stat{min-width:0;overflow:hidden}
.stat .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa button{min-height:66px;line-height:1.25}

/* Gamification : carte niveau */
.level-card{background:linear-gradient(135deg,#1f927e 0%,#2bb39a 55%,#5cc9a7 100%);color:#fff;border:0;cursor:pointer}
.level-card .lvl-badge{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.level-card .lv-t{font-size:19px;font-weight:800;letter-spacing:-.3px}
.level-card .lv-j{font-size:26px;font-weight:900;letter-spacing:-.5px}
.xpbar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:14px}
.xpbar > i{display:block;height:100%;background:linear-gradient(90deg,#ffd27a,#ff8a6b);border-radius:99px;transition:width .8s}
.journey{position:relative;height:4px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:12px}
.journey > i{display:block;height:100%;background:#fff;border-radius:9px}
.journey .flag{position:absolute;right:-4px;top:-11px;font-size:14px}
.lvl-burst{width:110px;height:110px;margin:0 auto;border-radius:32px;background:linear-gradient(135deg,var(--teal),#7fd6c3);color:#fff;font-size:52px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(43,179,154,.45);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* Missions du jour */
.missions .slot-h{font-size:13px;font-weight:800;color:var(--muted);margin:14px 2px 4px;letter-spacing:.2px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-of-type{border-bottom:0}
.task .tick{width:26px;height:26px;border-radius:9px;border:2px solid rgba(29,43,40,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;transition:all .2s}
.task.hi .tick{border-color:var(--peach)}
.task.done .tick{background:var(--teal);border-color:var(--teal)}
.task .tl{flex:1;min-width:0;display:flex;flex-direction:column}
.task .tx{font-size:14px;font-weight:600;line-height:1.3}
.task.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(29,43,40,.3)}
.task .th{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.task .xp{font-size:12px;font-weight:800;color:var(--teal-d);background:var(--teal-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.task .rm{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.main-mission{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--peach),#ffb39e);color:#fff;border-radius:18px;padding:14px;margin-top:10px;cursor:pointer;box-shadow:0 8px 20px rgba(255,138,107,.3)}

@keyframes monBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.01,.99)}}

<script>
'use strict';
/* Summer Body — appli de suivi 100 % locale (IndexedDB). Aucune donnée ne quitte le téléphone. */

const APP_VERSION = '2.1.0';

/* ---------------- Base de données locale ---------------- */
const DB_NAME = 'summerbody';
const STORES = ['meals', 'workouts', 'body', 'settings', 'chat'];
let _db;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      for (const s of ['meals', 'workouts', 'body']) {
        if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }).createIndex('date', 'date');
      }
      if (!db.objectStoreNames.contains('chat')) db.createObjectStore('chat', { keyPath: 'id' }).createIndex('ts', 'ts');
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    Promise.resolve(fn(s)).then(v => { out = v; });
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = store => tx(store, 'readonly', s => req(s.getAll()));
const dbGet = (store, key) => tx(store, 'readonly', s => req(s.get(key)));
const dbPut = (store, val) => tx(store, 'readwrite', s => req(s.put(val)));
const dbDel = (store, key) => tx(store, 'readwrite', s => req(s.delete(key)));
const dbClear = store => tx(store, 'readwrite', s => req(s.clear()));

async function getSetting(key, def = null) { const r = await dbGet('settings', key); return r ? r.value : def; }
const setSetting = (key, value) => dbPut('settings', { key, value });

/* ---------------- Utilitaires ---------------- */
const $ = sel => document.querySelector(sel);
const view = () => $('#view');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = k => {
  const today = dateKey(), yest = dateKey(addDays(new Date(), -1));
  if (k === today) return "aujourd'hui";
  if (k === yest) return 'hier';
  return parseKey(k).toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' });
};
const fmtShort = k => parseKey(k).toLocaleDateString('fr-BE', { day: 'numeric', month: 'short' });
const timeNow = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const r1 = n => Math.round(n * 10) / 10;
const weekStart = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };

let objectURLs = [];
function blobURL(b) { if (!b) return ''; const u = URL.createObjectURL(b); objectURLs.push(u); return u; }
function freeURLs() { objectURLs.forEach(u => URL.revokeObjectURL(u)); objectURLs = []; }

let toastTimer;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

function openSheet(html) {
  $('#sheet').innerHTML = html; $('#sheet').hidden = false; $('#sheet-backdrop').hidden = false;
  $('#sheet').scrollTop = 0;
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet-backdrop').hidden = true; $('#sheet').innerHTML = ''; }
$('#sheet-backdrop').addEventListener('click', closeSheet);

function confirmSheet(msg, okLabel = 'Confirmer', danger = true) {
  return new Promise(resolve => {
    openSheet(`<h2>${esc(msg)}</h2><div class="sheet-actions">
      <button class="btn ghost" id="c-no">Annuler</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="c-yes">${esc(okLabel)}</button></div>`);
    $('#c-no').onclick = () => { closeSheet(); resolve(false); };
    $('#c-yes').onclick = () => { closeSheet(); resolve(true); };
  });
}

/* Réduit une photo à 1600 px max (qualité JPEG 0,85) pour garder une bonne qualité sans exploser le stockage. */
async function resizeImage(file, max = 1600, quality = 0.85) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  } catch { return file; }
}

/* ---------------- Graphique en ligne (SVG) ---------------- */
function lineChart(points, { target = null, unit = '', h = 150 } = {}) {
  if (points.length < 2) return `<div class="muted small">Ajoute au moins 2 mesures pour voir ta courbe.</div>`;
  const W = 320, H = h, P = { l: 34, r: 10, t: 12, b: 22 };
  const xs = points.map(p => parseKey(p.x).getTime());
  let ys = points.map(p => p.y);
  if (target != null) ys = ys.concat(target);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  if (yMax - yMin < 2) { yMin -= 1; yMax += 1; }
  const padY = (yMax - yMin) * 0.12; yMin -= padY; yMax += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => P.l + (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * (H - P.t - P.b);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${path} L${X(xs[xs.length - 1]).toFixed(1)},${H - P.b} L${X(xs[0]).toFixed(1)},${H - P.b} Z`;
  const ticks = [yMin + padY, (yMin + yMax) / 2, yMax - padY].map(v => r1(v));
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2bb39a" stop-opacity=".28"/><stop offset="1" stop-color="#2bb39a" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(29,43,40,.08)" stroke-width="1"/><text x="${P.l - 6}" y="${Y(v) + 4}" fill="#8b93a3" font-size="10" text-anchor="end">${v}</text>`).join('')}
    ${target != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(target)}" y2="${Y(target)}" stroke="#ff8a6b" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - P.r}" y="${Y(target) - 4}" fill="#f06b4b" font-size="10" text-anchor="end">objectif ${target}${unit}</text>` : ''}
    <path d="${area}" fill="url(#g)"/>
    <path d="${path}" fill="none" stroke="#2bb39a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(xs[xs.length - 1])}" cy="${Y(last.y)}" r="4.5" fill="#ff8a6b" stroke="#fff" stroke-width="2"/>
    <text x="${P.l}" y="${H - 6}" fill="#8b93a3" font-size="10">${fmtShort(points[0].x)}</text>
    <text x="${W - P.r}" y="${H - 6}" fill="#8b93a3" font-size="10" text-anchor="end">${fmtShort(last.x)}</text>
  </svg>`;
}

/* ---------------- Calculs ---------------- */
const est1RM = (w, reps) => (w > 0 && reps > 0) ? w * (1 + reps / 30) : 0;

function computeRecords(workouts) {
  const best = {};
  const sorted = [...workouts].sort((a, b) => a.ts - b.ts);
  for (const w of sorted) for (const ex of w.exercises || []) for (const s of ex.sets || []) {
    if (!s.done) continue;
    const e = est1RM(num(s.weight) || 0, num(s.reps) || 0);
    const key = ex.name.trim().toLowerCase();
    if (e > 0 && (!best[key] || e > best[key].e1rm)) best[key] = { name: ex.name, weight: num(s.weight), reps: num(s.reps), e1rm: e, date: w.date };
  }
  return best;
}

function activityDays(meals, workouts, body) {
  const set = new Set();
  meals.forEach(m => set.add(m.date)); workouts.forEach(w => set.add(w.date)); body.forEach(b => set.add(b.date));
  return set;
}
function streakOf(days) {
  let d = new Date();
  if (!days.has(dateKey(d))) d = addDays(d, -1);
  let n = 0;
  while (days.has(dateKey(d))) { n++; d = addDays(d, -1); }
  return n;
}

const QUOTES = [
  "Chaque répétition compte. Celle d'aujourd'hui aussi.",
  "Le corps que tu veux cet été se construit maintenant.",
  "Pas besoin d'être parfait. Juste régulier.",
  "Tu ne regretteras jamais une séance faite.",
  "Un jour de plus dans la série. Ne la casse pas.",
  "Petits progrès, tous les jours : c'est comme ça qu'on se transforme.",
  "Fais aujourd'hui ce que le Hicham de juillet te remerciera d'avoir fait.",
  "La motivation te lance, l'habitude te fait arriver.",
  "Plus lourd qu'hier, plus fort que demain.",
  "Ton seul adversaire, c'est la version de toi d'hier.",
];
const quoteOfDay = () => { const d = new Date(); return QUOTES[(d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate()) % QUOTES.length]; };

/* ---------------- Navigation ---------------- */
let currentTab = 'home';
const VIEWS = {};
async function go(tab) {
  currentTab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  freeURLs();
  document.querySelectorAll('.fab').forEach(f => f.remove());
  await VIEWS[tab]();
  if (!(tab === 'meals' && mealsMode === 'chat')) window.scrollTo(0, 0);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

/* ---------- Éléments graphiques (anneaux, jauges, illustrations) ---------- */
function ring(pct, { size = 120, stroke = 12, color = 'var(--teal)', track = 'rgba(43,179,154,.13)', label = '', sub = '' } = {}) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" style="transition:stroke-dashoffset .8s"/></svg>
    <div class="ring-lbl">${label ? `<b>${label}</b>` : ''}${sub ? `<span>${sub}</span>` : ''}</div></div>`;
}
function semiGauge(pct, color = 'var(--teal)') {
  const p = Math.max(0, Math.min(100, pct || 0)), r = 46, c = Math.PI * r;
  return `<svg width="120" height="70" viewBox="0 0 120 70"><path d="M14 62 A46 46 0 0 1 106 62" fill="none" stroke="rgba(29,43,40,.08)" stroke-width="12" stroke-linecap="round"/>
    <path d="M14 62 A46 46 0 0 1 106 62" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/></svg>`;
}
const ART = [
  // haltère

async function getGoals() {
  const g = { ...(await getSetting('goals', {})) };
  const ph = phaseOf(dateKey());
  if (!g.kcalTarget) g.kcalTarget = ph ? ph.kcal : (dateKey() < PROG_START ? 2600 : null);
  return g;
}

/* ================= MISSIONS DU JOUR & GAMIFICATION ================= */
const SLOTS = [['matin', '🌅 Matin'], ['midi', '☀️ Midi'], ['soir', '🌙 Soir']];
const slotOfTime = t => { const h = parseInt((t || '12').split(':')[0], 10); return h < 11 ? 'matin' : h < 16 ? 'midi' : 'soir'; };

/* Index des données par jour, pour valider les missions automatiquement. */
function buildIndex(meals, workouts, body) {
  const ix = {};
  const get = k => (ix[k] = ix[k] || { meals: { matin: 0, midi: 0, soir: 0 }, prot: 0, workouts: 0, jjb: 0, weigh: false, checkin: false });
  meals.forEach(m => { const d = get(m.date); d.meals[slotOfTime(m.time)]++; d.prot += m.p || 0; });
  workouts.forEach(w => { if (w.type === 'jjb') get(w.date).jjb++; else get(w.date).workouts++; });
  body.forEach(b => { const d = get(b.date); if (b.weight != null) d.weigh = true; if (b.weight != null && (b.waist != null || b.photo)) d.checkin = true; });
  return ix;
}

/* La liste des missions d'une journée, selon le jour de la semaine et le calendrier du programme. */
function tasksFor(k, custom = []) {
  const wd = parseKey(k).getDay(); // 0 = dimanche
  const started = k >= PROG_START, finished = k > PROG_END;
  const T = [];
  const add = (id, slot, label, xp, opt = {}) => T.push({ id, slot, label, xp, prio: opt.prio || 'normale', auto: opt.auto || null, hint: opt.hint || '' });

  // Mission principale
  const seance = PROGRAMME_SB.jours.find(j => j.jourSemaine === wd);
  if (!started) add('main', 'main', 'Prépare-toi : relis ton programme dans l\'onglet Séances', 30, { prio: 'haute', hint: 'Le programme démarre le lundi 16 novembre.' });
  else if (finished) add('main', 'main', 'Garde le rythme : une séance ou 45 min de marche', 60, { prio: 'haute' });
  else if (seance) add('main', 'main', `${seance.nom} à la salle`, 100, { prio: 'haute', auto: d => d.workouts > 0, hint: isDeload(k) ? 'Semaine allégée : mêmes charges, une série de moins.' : 'Garde 1 à 2 répétitions en réserve.' });
  else if (wd === 3) add('main', 'main', 'Jiu-jitsu (1 h)', 80, { prio: 'haute', auto: d => d.jjb > 0, hint: 'Enregistre-le dans Séances → Jiu-jitsu.' });
  else if (wd === 0) add('main', 'main', 'Jiu-jitsu (2 h)', 100, { prio: 'haute', auto: d => d.jjb > 0, hint: 'Ce soir, la 2e portion de féculents est permise.' });
  else add('main', 'main', 'Jour de repos actif : marche de 30 à 45 min', 40, { prio: 'haute', hint: 'Le repos fait partie du programme : c\'est là que tu progresses.' });

  if (CHECKINS.includes(k)) add('checkin', 'matin', 'Check-in : balance Basic-Fit, tour de taille, photos face/profil/dos', 150, { prio: 'haute', auto: d => d.checkin, hint: 'Onglet Corps : la mesure Basic-Fit + tour de taille ou photo valide le check-in.' });

  // Matin
  if (seance && started) add('weigh', 'matin', 'Pesée sur la balance Basic-Fit (avant la séance)', 15, { prio: 'haute', auto: d => d.weigh, hint: 'Toujours dans les mêmes conditions : même heure, avant de manger si possible.' });
  add('water', 'matin', 'Un grand verre d\'eau au réveil', 5);
  add('creatine', 'matin', 'Créatine monohydrate (3 à 5 g)', 10, { hint: 'Tous les jours, même au repos : c\'est la régularité qui compte.' });
  add('breakfast', 'matin', 'Petit-déj avec une protéine (skyr, œufs…)', 10, { auto: d => d.meals.matin > 0, hint: 'Envoie-le au coach pour qu\'il soit noté.' });
  if ([2, 5].includes(wd) && started) add('mobility', 'matin', '10 min de mobilité / étirements', 15);

  // Midi
  add('lunch', 'midi', 'Déjeuner : ½ légumes, ¼ protéines, ¼ féculents', 15, { prio: 'haute', auto: d => d.meals.midi > 0, hint: 'Photo au coach = mission validée.' });
  add('drinks', 'midi', 'Que de l\'eau, du thé ou du café sans sucre', 10);
  if (seance && started) add('whey', 'midi', 'Whey après la séance (≈ 25 g de protéines)', 10, { hint: 'Les autres jours, seulement si tu es loin des 140 g.' });

  // Soir
  add('dinner', 'soir', wd === 0 ? 'Dîner post-JJB (2e portion de féculents OK)' : 'Dîner : pas de 2e assiette de féculents', 15, { prio: 'haute', auto: d => d.meals.soir > 0 });
  add('protein', 'soir', '140 g de protéines atteints', 25, { prio: 'haute', auto: d => d.prot >= 140, hint: 'Calculé à partir des repas notés par le coach.' });
  add('water2l', 'soir', 'Boire 2 L d\'eau dans la journée', 15, { hint: 'Un peu plus les jours de salle et de jiu-jitsu.' });
  add('steps', 'soir', '8 000 pas minimum', 20);
  add('magnesium', 'soir', 'Magnésium (dose indiquée sur ta boîte)', 10, { hint: 'Au dîner ou avant de dormir.' });
  if (wd === 0 && started) add('review', 'soir', 'Bilan de la semaine : regarde ta moyenne de poids (onglet Corps)', 20);
  add('sleep', 'soir', 'Au lit à temps pour 7 h 30 de sommeil', 15);

  custom.forEach(c => add(c.id, c.slot, c.label, 10, { prio: c.prio || 'normale' }));
  return T;
}

function dayStatus(k, rec, ix) {
  const tasks = tasksFor(k, (rec && rec.custom) || []);
  const d = ix[k] || { meals: { matin: 0, midi: 0, soir: 0 }, prot: 0, workouts: 0, jjb: 0, weigh: false, checkin: false };
  const done = (rec && rec.done) || {};
  const list = tasks.map(t => ({ ...t, autoDone: !!(t.auto && t.auto(d)), done: !!done[t.id] || !!(t.auto && t.auto(d)) }));
  const xp = list.filter(t => t.done).reduce((a, t) => a + t.xp, 0);
  const perfect = list.length > 0 && list.every(t => t.done);
  return { list, xp: xp + (perfect ? 50 : 0), perfect, doneCount: list.filter(t => t.done).length };
}

const LEVEL_TITLES = [[1, 'Recrue'], [3, 'Motivé'], [5, 'Régulier'], [8, 'Guerrier'], [11, 'Athlète'], [14, 'Machine'], [17, 'Spartiate'], [20, 'Légende Summer Body']];
const xpForLevel = L => 50 * L * (L - 1); // niveau 2 = 100 XP, niveau 10 = 4 500 XP, niveau 20 = 19 000 XP
function levelOf(xp) { let L = 1; while (xp >= xpForLevel(L + 1)) L++; return L; }
const titleOf = L => LEVEL_TITLES.filter(([n]) => L >= n).pop()[1];

/* Nombre de records battus au fil du temps (+25 XP chacun). */
function prEvents(workouts) {
  const best = {}; let n = 0;
  [...workouts].sort((a, b) => a.ts - b.ts).forEach(w => (w.exercises || []).forEach(ex => {
    const key = ex.name.trim().toLowerCase();
    let top = 0; (ex.sets || []).forEach(s => { if (s.done) top = Math.max(top, est1RM(num(s.weight) || 0, num(s.reps) || 0)); });
    if (top > 0) { if (best[key] && top > best[key]) n++; if (!best[key] || top > best[key]) best[key] = top; }
  }));
  return n;
}

async function computeGame() {
  const [meals, workouts, body, settingsRows, firstDay] = await Promise.all([dbAll('meals'), dbAll('workouts'), dbAll('body'), dbAll('settings'), getSetting('firstDay')]);
  const ix = buildIndex(meals, workouts, body);
  const recs = Object.fromEntries(settingsRows.filter(r => r.key.startsWith('day:')).map(r => [r.key.slice(4), r.value]));
  const today = dateKey();
  const from = [firstDay || today, ...Object.keys(recs)].sort()[0];
  let xp = 0, perfectDays = 0, protDays = 0, jjb = 0, daysXp = {};
  for (let d = parseKey(from); dateKey(d) <= today; d = addDays(d, 1)) {
    const k = dateKey(d), st = dayStatus(k, recs[k], ix);
    xp += st.xp; daysXp[k] = st.xp;
    if (st.perfect) perfectDays++;
    if ((ix[k] || {}).prot >= 140 || (recs[k] && recs[k].done && recs[k].done.protein)) protDays++;
    const main = st.list.find(t => t.id === 'main');
    if (main && main.done && /Jiu-jitsu/.test(main.label)) jjb++;
  }
  // Séances faites hors des jours prévus : bonus
  const plannedDays = new Set(PROGRAMME_SB.jours.map(j => j.jourSemaine));
  const gymW = workouts.filter(w => w.type !== 'jjb'), jjbW = workouts.filter(w => w.type === 'jjb');
  const extra = gymW.filter(w => !plannedDays.has(parseKey(w.date).getDay())).length;
  const jjbExtra = jjbW.filter(w => !JJB_DAYS[parseKey(w.date).getDay()]).length;
  jjb += jjbExtra; xp += jjbExtra * 40;
  const prs = prEvents(workouts);
  xp += extra * 60 + prs * 25;

  // Semaines complètes (3 séances du lundi au dimanche)
  const byWeek = {};
  gymW.forEach(w => { const k = dateKey(weekStart(parseKey(w.date))); byWeek[k] = (byWeek[k] || 0) + 1; });
  const fullWeeks = Object.values(byWeek).filter(n => n >= 3).length;
  xp += fullWeeks * 100;

  const streak = streakOf(activityDays(meals, workouts, body));
  const checkins = CHECKINS.filter(c => c <= today && (ix[c] || {}).checkin).length;
  const level = levelOf(xp);
  const B = (id, ico, nom, desc, ok) => ({ id, ico, nom, desc, ok: !!ok });
  const badges = [
    B('first', '🏁', 'Premier pas', 'Ta première séance enregistrée', gymW.length >= 1),
    B('week', '📆', 'Semaine complète', '3 séances dans la même semaine', fullWeeks >= 1),
    B('week4', '🗓️', 'Un mois carré', '4 semaines complètes', fullWeeks >= 4),
    B('s7', '🔥', 'En feu', '7 jours d\'affilée actifs', streak >= 7),
    B('s30', '☄️', 'Inarrêtable', '30 jours d\'affilée actifs', streak >= 30),
    B('pr1', '🏆', 'Record !', 'Battre un record personnel', prs >= 1),
    B('pr10', '👑', 'Collectionneur', '10 records battus', prs >= 10),
    B('prot7', '🥩', 'Protéiné', '140 g de protéines sur 7 jours', protDays >= 7),
    B('perfect', '💯', 'Journée parfaite', 'Toutes les missions d\'une journée', perfectDays >= 1),
    B('perfect10', '✨', 'Perfectionniste', '10 journées parfaites', perfectDays >= 10),
    B('jjb10', '🥋', 'Tatami', '10 séances de jiu-jitsu', jjb >= 10),
    B('w25', '💪', 'Bête de salle', '25 séances de salle', gymW.length >= 25),
    B('checkin1', '📸', 'Premier bilan', 'Check-in du 13 décembre', checkins >= 1),
    B('checkin4', '🎯', 'Ligne d\'arrivée', 'Les 4 check-ins jusqu\'au 10 mars', checkins >= 4),
    B('lvl10', '⭐', 'Niveau 10', 'Atteindre le niveau 10', level >= 10),
    B('lvl20', '🌟', 'Légende', 'Atteindre le niveau 20', level >= 20),
  ];
  return { xp, level, title: titleOf(level), next: xpForLevel(level + 1), cur: xpForLevel(level), badges, perfectDays, prs, fullWeeks, streak, ix, recs, daysXp, extra, jjb };
}

async function getDayRec(k) { return (await getSetting('day:' + k)) || { done: {}, custom: [] }; }

async function toggleTask(k, t) {
  const before = await computeGame();
  const rec = await getDayRec(k);
  if (t.autoDone && !rec.done[t.id]) { toast('✓ Déjà validée automatiquement'); return; }
  rec.done[t.id] = !rec.done[t.id];
  if (!rec.done[t.id]) delete rec.done[t.id];
  await setSetting('day:' + k, rec);
  const after = await computeGame();
  const diff = after.xp - before.xp;
  if (diff > 0) { toast(`+${diff} XP ${diff >= 50 ? '🔥' : '⚡'}`); sessionStorage.setItem('monHappy', '1'); }
  await checkLevelUp(after);
}

async function checkLevelUp(game) {
  game = game || await computeGame();
  const last = await getSetting('lastLevel', 1);
  const lastBadges = new Set(await getSetting('seenBadges', []));

    navigator.vibrate && navigator.vibrate([80, 60, 80, 60, 160]);
    const s0 = monStageOf(last), s1 = monStageOf(game.level);
    const evolved = s1 > s0;
    openSheet(`<div style="text-align:center;padding:12px 0">

      <div class="small muted" style="margin-top:4px">${esc(MON_STAGES[s1].desc)}</div>` : `<div class="lvl-burst">${game.level}</div>`}

      ${newBadges.length ? `<div style="margin-top:14px">${newBadges.map(b => `<span class="chip good">${b.ico} ${esc(b.nom)}</span>`).join('')}</div>` : ''}
      <div class="quote" style="margin-top:14px">${esc(quoteOfDay())}</div>

    $('#lv-ok').onclick = () => { closeSheet(); if (currentTab === 'home') go('home'); };
  } else if (newBadges.length) {
    toast(`Trophée débloqué : ${newBadges[0].ico} ${newBadges[0].nom}`, 3500);
  }
  if (game.level !== last) await setSetting('lastLevel', game.level);
  if (newBadges.length) await setSetting('seenBadges', [...lastBadges, ...newBadges.map(b => b.id)]);
}

    <div class="card">

    ${ph ? `<div class="card green"><div class="small muted" style="font-weight:700">PHASE ${ph.n} · ${esc(ph.nom.toUpperCase())} · ~${ph.kcal} kcal</div><div style="margin-top:4px;font-weight:600">${esc(ph.conseil)}</div>

  `;
  const rs = $('#resume'); if (rs) rs.onclick = () => go('train');
  $('#level-card').onclick = () => trophiesSheet(game);
  $('#qa-train').onclick = async () => { if (!active && nextDay) await startSession(nextDay); go('train'); };
  $('#qa-food').onclick = () => quickMealPhoto();

  $('#add-task').onclick = () => addTaskSheet(today);
  view().querySelectorAll('[data-rm]').forEach(b => b.onclick = async e => {

    await setSetting('day:' + today, r); go('home');
  });
  view().querySelectorAll('[data-task]').forEach(el => el.onclick = async () => {
    const t = st.list.find(x => x.id === el.dataset.task); if (!t) return;
    const seance = PROGRAMME_SB.jours.find(j => j.jourSemaine === parseKey(today).getDay());
    if (t.id === 'main' && seance && !t.done && today >= PROG_START && today <= PROG_END) {
      if (!active) await startSession(program && program.jours ? (program.jours.find(j => j.nom === seance.nom) || seance) : seance);
      go('train'); return;
    }
    if (t.id === 'main' && /Jiu-jitsu/.test(t.label) && !t.done) { jjbSheet(today); return; }
    await toggleTask(today, t); go('home');

  checkLevelUp(game);
};

async function suggestNextDay(program, workouts) {
  if (!program || !program.jours || !program.jours.length) return null;
  if (program.jours.some(j => j.jourSemaine != null)) {
    // Séance prévue aujourd'hui, sinon la prochaine dans la semaine
    for (let i = 0; i < 7; i++) {
      const d = addDays(new Date(), i), wd = d.getDay();
      const j = program.jours.find(x => x.jourSemaine === wd);
      if (j && !(i === 0 && workouts.some(w => w.date === dateKey() && w.type !== 'jjb'))) return j;
    }
  }
  const last = [...workouts].filter(w => w.programDay != null).sort((a, b) => b.ts - a.ts)[0];
  const idx = last ? (program.jours.findIndex(j => j.nom === last.programDay) + 1) % program.jours.length : 0;
  return program.jours[Math.max(0, idx)];
}

const CLAUDE_PROMPT = desc =>
  `Coach, estime les calories de ce plat : ${desc || '(voir photo)'}.\n` +
  `Réponds d'abord sur une ligne au format : KCAL=xxx P=xx G=xx L=xx (protéines, glucides, lipides en grammes), puis un court commentaire.`;

function parseClaudeAnswer(txt) {
  const out = {};
  const grab = (re) => { const m = txt.match(re); return m ? parseFloat(m[1].replace(',', '.')) : null; };
  out.kcal = grab(/KCAL\s*[=:]\s*~?\s*(\d+(?:[.,]\d+)?)/i) ?? grab(/(\d{2,4})\s*(?:kcal|calories)/i);
  out.p = grab(/\bP\s*[=:]\s*~?\s*(\d+(?:[.,]\d+)?)/) ?? grab(/prot[ée]ines?\s*[:=]?\s*~?\s*(\d+(?:[.,]\d+)?)/i);
  out.g = grab(/\bG\s*[=:]\s*~?\s*(\d+(?:[.,]\d+)?)/) ?? grab(/glucides?\s*[:=]?\s*~?\s*(\d+(?:[.,]\d+)?)/i);
  out.l = grab(/\bL\s*[=:]\s*~?\s*(\d+(?:[.,]\d+)?)/) ?? grab(/lipides?\s*[:=]?\s*~?\s*(\d+(?:[.,]\d+)?)/i);
  return out;
}

IMPORTANT — enregistrement au journal : chaque fois qu'il te signale un repas qu'il mange ou a mangé, termine ta réponse par un bloc exactement de ce format, sur sa propre ligne :
<repas>{"desc":"description courte","kcal":650,"p":40,"g":70,"l":18,"heure":"12:30"}</repas>
"heure" seulement s'il précise un autre moment que maintenant, sinon omets-la. S'il corrige un repas qu'il vient d'envoyer (« en fait c'était une demi-portion »), renvoie le bloc corrigé avec "remplace":true. N'ajoute PAS de bloc pour une simple question, une idée de repas ou un aliment qu'il n'a pas mangé.

Il peut aussi te poser des questions (quoi manger ce soir, collations riches en protéines, etc.) : réponds en tenant compte de sa journée et de ses objectifs.

Contexte (date : ${today}, heure : ${timeNow()}) :
- Phase du programme : ${phaseOf(today) ? `${phaseOf(today).n} (${phaseOf(today).nom})` : today < PROG_START ? 'avant le démarrage (16 nov.)' : 'hors programme'}${isFestive(today) ? ' — période des fêtes : profiter sans culpabiliser' : ''}.
- Objectifs : ${goals.kcalTarget ? `environ ${goals.kcalTarget} kcal/jour` : 'repère calorique non défini'}${goals.targetWeight ? `, poids visé ${goals.targetWeight} kg` : ''}${goals.targetDate ? ` pour le ${goals.targetDate}` : ''}.

${extra ? `- Infos du coach (bilan personnel) : ${extra}` : ''}`;

async function buildApiMessages(msgs) {
  // On garde les 16 derniers messages valides ; seules les 2 dernières photos sont envoyées (économie).
  const usable = msgs.filter(m => m.role === 'user' || (m.role === 'assistant' && !m.status)).slice(-16);
  const photoIdx = new Set(usable.map((m, i) => (m.role === 'user' && (m.photo || m.mealId)) ? i : -1).filter(i => i >= 0).slice(-2));
  const meals = Object.fromEntries((await dbAll('meals')).map(m => [m.id, m]));
  const out = [];
  for (let i = 0; i < usable.length; i++) {
    const m = usable[i];
    const content = [];
    const photo = m.photo || (m.mealId && meals[m.mealId] && meals[m.mealId].photo);
    if (m.role === 'user' && photo) {
      if (photoIdx.has(i)) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobToBase64Jpeg(photo) } });
      else content.push({ type: 'text', text: '[photo envoyée plus tôt]' });
    }
    const t = m.role === 'assistant' ? (m.raw || m.text) : m.text;
    if (t) content.push({ type: 'text', text: t });
    if (!content.length) content.push({ type: 'text', text: '(photo)' });
    const prev = out[out.length - 1];
    if (prev && prev.role === m.role) prev.content.push(...content);
    else out.push({ role: m.role, content });
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

function parseMealTag(raw) {
  const m = raw.match(/<repas>\s*([\s\S]*?)\s*<\/repas>/i);
  const clean = raw.replace(/<repas>[\s\S]*?<\/repas>/gi, '').trim();
  if (!m) return { clean, meal: null };
  try { return { clean, meal: JSON.parse(m[1]) }; } catch { return { clean, meal: null }; }
}

async function sendToCoach() {
  if (chatBusy) return;
  const key = await getSetting('apiKey');
  let msgs = await chatAll();
  const pending = msgs.filter(m => m.role === 'user' && (m.status === 'pending' || m.status === 'error'));
  if (!pending.length) { refreshChatIfVisible(); return; }
  if (!key) {
    for (const p of pending) { p.status = 'error'; p.error = 'Clé API manquante (Profil)'; await dbPut('chat', p); }
    refreshChatIfVisible(); return;
  }
  if (!navigator.onLine) {
    for (const p of pending) { p.status = 'pending'; await dbPut('chat', p); }
    refreshChatIfVisible(); toast('Hors ligne : envoi automatique au retour du réseau.'); return;
  }
  chatBusy = true; refreshChatIfVisible();
  try {
    const model = await getSetting('model', MODELS[0][0]);
    const body = { model, max_tokens: 900, system: await buildSystemPrompt(), messages: await buildApiMessages(msgs) };
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      let detail = ''; try { detail = (await res.json()).error.message; } catch { }
      const msg = res.status === 401 ? 'Clé API invalide' : res.status === 402 || /credit/i.test(detail) ? 'Crédit API épuisé' : res.status === 429 ? 'Trop de demandes, réessaie dans un instant' : res.status >= 500 ? 'Service momentanément indisponible' : `Erreur ${res.status}`;
      throw Object.assign(new Error(msg), { detail });
    }
    const data = await res.json();
    const raw = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
    const { clean, meal } = parseMealTag(raw);
    const reply = { id: uid(), ts: Date.now(), role: 'assistant', text: clean, raw };
    const lastUser = pending[pending.length - 1];
    if (meal && meal.kcal != null) reply.loggedMealId = await logMealFromChat(meal, lastUser, msgs);
    for (const p of pending) { p.status = null; p.error = null; await dbPut('chat', p); }
    await dbPut('chat', reply);
  } catch (e) {
    const offline = e instanceof TypeError || !navigator.onLine;
    for (const p of pending) { p.status = offline ? 'pending' : 'error'; p.error = offline ? null : e.message; await dbPut('chat', p); }
    if (!offline) toast(e.message + (e.detail ? ' — ' + e.detail : ''), 4500);
  } finally {
    chatBusy = false; refreshChatIfVisible();
  }
}

async function logMealFromChat(meal, userMsg, msgs) {
  const n = v => (v == null || isNaN(+v)) ? null : Math.round(+v);
  // Correction d'un repas déjà enregistré ?
  if (meal.remplace) {
    const prev = [...msgs].reverse().find(m => m.role === 'assistant' && m.loggedMealId);
    const existing = prev && await dbGet('meals', prev.loggedMealId);
    if (existing) {
      Object.assign(existing, { desc: meal.desc || existing.desc, kcal: n(meal.kcal), p: n(meal.p), g: n(meal.g), l: n(meal.l) });
      if (userMsg && userMsg.photo && !existing.photo) { existing.photo = userMsg.photo; userMsg.photo = null; userMsg.mealId = existing.id; }
      await dbPut('meals', existing); return existing.id;
    }
  }
  const m = { id: uid(), date: dateKey(), time: /^\d{1,2}:\d{2}$/.test(meal.heure || '') ? meal.heure.padStart(5, '0') : timeNow(), ts: Date.now(),
    desc: meal.desc || (userMsg && userMsg.text) || 'Repas', kcal: n(meal.kcal), p: n(meal.p), g: n(meal.g), l: n(meal.l), photo: null, fromChat: true };
  if (userMsg && userMsg.photo) { m.photo = userMsg.photo; userMsg.photo = null; userMsg.mealId = m.id; }
  await dbPut('meals', m);
  return m.id;
}

async function retryMsg(id) {
  const m = await dbGet('chat', id); if (!m) return;
  m.status = 'pending'; m.error = null; await dbPut('chat', m); sendToCoach();
}

async function startSession(day) {
  const workouts = await dbAll('workouts');
  const s = {
    id: uid(), date: dateKey(), start: timeNow(), ts: Date.now(),
    name: day ? day.nom : 'Séance libre', programDay: day ? day.nom : null,
    deload: isDeload(dateKey()), technique: progWeek(dateKey()) >= 1 && progWeek(dateKey()) <= 2,
    exercises: day ? day.exercices.map(e => {
      const series = Math.max(1, (e.series || 3) - (isDeload(dateKey()) ? 1 : 0));
      return { name: e.nom, target: e.reps ? `${series}×${e.reps}` : '', rest: e.repos || 90, tip: e.conseil || '',
        sets: [...Array(series)].map((_, i) => prefillSet(workouts, e.nom, i)) };
    }) : [],
  };
  await setSetting('activeSession', s);
  return s;
}
function lastPerf(workouts, name) {
  const key = name.trim().toLowerCase();
  const w = [...workouts].sort((a, b) => b.ts - a.ts).find(w => (w.exercises || []).some(e => e.name.trim().toLowerCase() === key));
  if (!w) return null;
  const ex = w.exercises.find(e => e.name.trim().toLowerCase() === key);
  return { date: w.date, sets: ex.sets.filter(s => s.done) };
}
function prefillSet(workouts, name, i) {
  const lp = lastPerf(workouts, name);
  const s = lp && (lp.sets[i] || lp.sets[lp.sets.length - 1]);
  return { weight: s ? s.weight : '', reps: s ? s.reps : '', done: false };
}

function planFor(k) {
  const wd = parseKey(k).getDay();
  const inProg = k >= PROG_START && k <= PROG_END;
  const seance = PROGRAMME_SB.jours.find(j => j.jourSemaine === wd);
  const p = { k, wd, kind: 'rest', label: 'Repos actif (marche)', ico: '🚶', inProg };
  if (!inProg) { p.kind = 'off'; p.label = k < PROG_START ? 'Avant le programme' : 'Après le programme'; p.ico = '·'; }
  else if (seance) Object.assign(p, { kind: 'gym', label: `${seance.nom} · salle`, ico: '🏋️', seance });
  else if (JJB_DAYS[wd]) Object.assign(p, { kind: 'jjb', label: `Jiu-jitsu (${JJB_DAYS[wd] / 60} h)`, ico: '🥋', minutes: JJB_DAYS[wd] });
  p.checkin = CHECKINS.includes(k);
  p.deload = isDeload(k);
  p.festive = isFestive(k);
  return p;
}

        return `<div class="list-row hist" data-id="${w.id}"><span class="icn" style="background:${BG[i % BG.length]}">🏋️</span>
          <div style="flex:1;min-width:0"><b>${esc(w.name)}</b><div class="small muted">${fmtDay(w.date)} · ${done} séries${w.duration ? ' · ' + w.duration + ' min' : ''}</div></div>

    ${recs.length ? `<div class="card yellow"><h2>Records 🏆</h2><table><tr><th>Exercice</th><th>Meilleure série</th><th>1RM est.</th></tr>
      ${recs.map(r => `<tr><td>${esc(r.name)}</td><td class="pr">${r.weight} × ${r.reps}</td><td>${Math.round(r.e1rm)} kg</td></tr>`).join('')}</table></div>` : ''}
  `;
  bindSegTrain();
  view().querySelectorAll('[data-day]').forEach(b => b.onclick = async () => { await startSession(program.jours[+b.dataset.day]); go('train'); });
  view().querySelectorAll('[data-jjb]').forEach(b => b.onclick = () => {
    // Le jour J (ou le dernier mercredi/dimanche passé)
    let d = new Date(); for (let i = 0; i < 7 && d.getDay() !== +b.dataset.jjb; i++) d = addDays(d, -1);
    jjbSheet(dateKey(d));
  });
  $('#jjb-add').onclick = () => jjbSheet(today);
  $('#free').onclick = async () => { await startSession(null); go('train'); };
  view().querySelectorAll('.hist').forEach(el => el.onclick = () => workoutDetail(workouts.find(w => w.id === el.dataset.id)));
};

async function renderAgenda() {
  const workouts = await dbAll('workouts');
  const byDate = {};
  workouts.forEach(w => (byDate[w.date] = byDate[w.date] || []).push(w));
  const today = dateKey();
  if (!agendaMonth) agendaMonth = (today < PROG_START ? PROG_START : today > PROG_END ? PROG_END : today).slice(0, 7);
  const [y, m] = agendaMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const monthName = first.toLocaleDateString('fr-BE', { month: 'long', year: 'numeric' });
  const canPrev = agendaMonth > PROG_START.slice(0, 7), canNext = agendaMonth < PROG_END.slice(0, 7);

  const status = k => {
    const p = planFor(k), ws = byDate[k] || [];
    const gymDone = ws.some(isGym), jjbDone = ws.some(w => !isGym(w));
    const done = p.kind === 'gym' ? gymDone : p.kind === 'jjb' ? jjbDone : false;
    return { p, gymDone, jjbDone, done, missed: !done && k < today && (p.kind === 'gym' || p.kind === 'jjb') };
  };
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-d empty"></div>';
  for (let d = 1; d <= daysIn; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`, s = status(k);
    cells += `<div class="cal-d ${s.p.kind} ${k === today ? 'today' : ''} ${s.done ? 'done' : ''} ${s.missed ? 'missed' : ''} ${s.p.deload ? 'deload' : ''}" data-k="${k}">
      <span class="cn">${d}</span><span class="ci">${s.done ? '✓' : s.p.kind === 'gym' ? s.p.seance.nom.slice(-1) : s.p.kind === 'jjb' ? '🥋' : ''}</span>${s.p.checkin ? '<span class="cc">📸</span>' : ''}${(s.gymDone && s.p.kind !== 'gym') || (s.jjbDone && s.p.kind !== 'jjb') ? '<span class="cx">+</span>' : ''}</div>`;
  }
  // Liste de la semaine en cours
  const ws0 = weekStart(parseKey(today < PROG_START ? PROG_START : today));
  const week = [...Array(7)].map((_, i) => dateKey(addDays(ws0, i))).map(k => {
    const s = status(k);
    return `<div class="list-row agenda-row" data-k="${k}"><span class="icn" style="background:${s.p.kind === 'gym' ? 'var(--teal-soft)' : s.p.kind === 'jjb' ? 'var(--lilac-soft)' : 'var(--card2)'}">${s.p.ico}</span>
      <div style="flex:1;min-width:0"><b style="text-transform:capitalize">${fmtDay(k)}</b><div class="small muted">${esc(s.p.label)}${s.p.checkin ? ' · 📸 check-in' : ''}${s.p.deload ? ' · allégée' : ''}</div></div>
      <span class="small" style="font-weight:800;color:${s.done ? 'var(--teal-d)' : s.missed ? 'var(--bad)' : 'var(--muted)'}">${s.done ? 'Fait ✓' : s.missed ? 'Manqué' : k === today ? "Aujourd'hui" : ''}</span></div>`;
  }).join('');

  view().innerHTML = segTrain() + `
    <div class="card">
      <div class="row between"><button class="btn sm ghost" id="cal-p" ${canPrev ? '' : 'disabled style="opacity:.3"'}>‹</button>
        <h2 style="margin:0;text-transform:capitalize">${monthName}</h2>
        <button class="btn sm ghost" id="cal-n" ${canNext ? '' : 'disabled style="opacity:.3"'}>›</button></div>
      <div class="cal-h">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="cal">${cells}</div>
      <div class="cal-legend small muted"><span><i class="lg gym"></i>Salle A/B/C</span><span><i class="lg jjb"></i>Jiu-jitsu</span><span><i class="lg rest"></i>Repos</span><span>📸 Check-in</span><span><i class="lg done"></i>Fait</span></div>
    </div>
    <div class="card"><h2>Cette semaine</h2>${week}</div>
    <div class="card small muted">Semaine allégée du 11 au 17 janvier · Fêtes du 24 déc. au 1er janv. · Fin du programme le 10 mars.</div>`;
  bindSegTrain();
  const shift = n => { const d = new Date(y, m - 1 + n, 1); agendaMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; go('train'); };
  if (canPrev) $('#cal-p').onclick = () => shift(-1);
  if (canNext) $('#cal-n').onclick = () => shift(1);
  view().querySelectorAll('[data-k]').forEach(el => el.onclick = () => daySheet(el.dataset.k, status(el.dataset.k), byDate[el.dataset.k] || []));
}

    <div class="card ${p.kind === 'gym' ? 'mint' : p.kind === 'jjb' ? 'lilac' : ''}" style="margin-top:12px"><div style="font-size:17px;font-weight:800">${p.ico} ${esc(p.label)}</div>
      ${p.kind === 'gym' ? `<div class="small muted" style="margin-top:4px">${p.seance.exercices.map(e => esc(e.nom)).join(' · ')}</div>` : ''}

let saveSessTimer;
function persistSession(s) { clearTimeout(saveSessTimer); saveSessTimer = setTimeout(() => setSetting('activeSession', s), 250); }

async function renderSession(s) {
  const workouts = await dbAll('workouts');
  const records = computeRecords(workouts);
  view().innerHTML = `
    <div id="timer-slot"></div>
    <div class="row between" style="margin:8px 2px"><div><h2 style="margin:0">${esc(s.name)}</h2><div class="small muted">Commencée à ${esc(s.start)}</div></div>
      <button class="btn sm ghost" id="s-cancel">Abandonner</button></div>
    ${s.programDay ? `<details class="card warmup" ${s.exercises.some(e => e.sets.some(x => x.done)) ? '' : 'open'}><summary><b>🔥 Échauffement (8 min)</b></summary>
      <ol class="small" style="margin:8px 0 0;padding-left:18px;line-height:1.6">${WARMUP.map(w => `<li>${esc(w)}</li>`).join('')}</ol></details>` : ''}
    ${s.technique ? `<div class="card yellow small"><b>Semaines 1–2 : la technique avant la charge.</b> Charges légères, 3 répétitions en réserve.</div>` : ''}
    ${s.deload ? `<div class="card green small"><b>Semaine allégée.</b> Mêmes charges, une série de moins par exercice.</div>` : ''}
    <div id="ex-list">${s.exercises.map((e, ei) => exHTML(e, ei, workouts)).join('')}</div>
    <div class="small muted" style="margin:8px 4px">Forme du jour : moins de 6 h de sommeil, JJB très dur ou une douleur ? Enlève une série par exercice, sans baisser la charge. Douleur articulaire vive : arrête l'exercice.</div>
    <button class="btn block" id="s-addex" style="margin-top:6px">+ Ajouter un exercice</button>
    <label>Notes de séance</label><textarea id="s-notes" placeholder="Sensations, douleurs, énergie...">${esc(s.notes || '')}</textarea>
    <button class="btn primary block" id="s-finish" style="margin-top:14px">Terminer la séance ✓</button>`;
  renderTimer();

  const list = $('#ex-list');
  list.addEventListener('input', e => {
    const el = e.target; const ei = +el.dataset.ei, si = +el.dataset.si;
    if (el.dataset.f) { s.exercises[ei].sets[si][el.dataset.f] = el.value; persistSession(s); }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const ei = +b.dataset.ei;
    if (b.classList.contains('ok')) {
      const st = s.exercises[ei].sets[+b.dataset.si];
      st.done = !st.done; b.classList.toggle('done', st.done);
      if (st.done) {
        const key = s.exercises[ei].name.trim().toLowerCase();
        const e1 = est1RM(num(st.weight) || 0, num(st.reps) || 0);
        if (e1 > 0 && (!records[key] || e1 > records[key].e1rm)) { toast('🏆 Nouveau record sur ' + s.exercises[ei].name + ' !', 3000); navigator.vibrate && navigator.vibrate([60, 40, 60]); }
        startRest(s.exercises[ei].rest || 90);
      }
      persistSession(s);
    } else if (b.dataset.act === 'addset') {
      const sets = s.exercises[ei].sets; const l = sets[sets.length - 1] || {};
      sets.push({ weight: l.weight || '', reps: l.reps || '', done: false }); persistSession(s); renderSession(s);
    } else if (b.dataset.act === 'rmset') {
      const sets = s.exercises[ei].sets; if (sets.length > 1) sets.pop(); persistSession(s); renderSession(s);
    } else if (b.dataset.act === 'rmex') {
      s.exercises.splice(ei, 1); persistSession(s); renderSession(s);
    }
  });
  $('#s-notes').oninput = e => { s.notes = e.target.value; persistSession(s); };
  $('#s-addex').onclick = () => {
    const names = [...new Set(workouts.flatMap(w => (w.exercises || []).map(e => e.name)))].sort();
    openSheet(`<h2>Ajouter un exercice</h2><label>Nom</label><input id="nx" list="nx-list" placeholder="ex. Tractions"><datalist id="nx-list">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="grid2"><div><label>Séries</label><input id="nx-s" inputmode="numeric" value="3"></div><div><label>Repos (s)</label><input id="nx-r" inputmode="numeric" value="90"></div></div>
      <div class="sheet-actions"><button class="btn ghost" id="nx-c">Annuler</button><button class="btn primary" id="nx-ok">Ajouter</button></div>`);
    $('#nx').focus();
    $('#nx-c').onclick = closeSheet;
    $('#nx-ok').onclick = () => {
      const n = $('#nx').value.trim(); if (!n) return;
      const k = Math.max(1, parseInt($('#nx-s').value) || 3);
      s.exercises.push({ name: n, target: '', rest: parseInt($('#nx-r').value) || 90, tip: '', sets: [...Array(k)].map((_, i) => prefillSet(workouts, n, i)) });
      closeSheet(); setSetting('activeSession', s).then(() => renderSession(s));
    };
  };
  $('#s-cancel').onclick = async () => {
    if (await confirmSheet('Abandonner cette séance ? Rien ne sera enregistré.', 'Abandonner')) { await setSetting('activeSession', null); stopRest(); go('train'); }
  };
  $('#s-finish').onclick = async () => {
    clearTimeout(saveSessTimer);
    const doneSets = s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
    if (!doneSets && !(await confirmSheet("Aucune série validée (✓). Enregistrer quand même ?", 'Enregistrer', false))) return;
    const w = { ...s, duration: Math.max(1, Math.round((Date.now() - s.ts) / 60000)) };
    await dbPut('workouts', w); await setSetting('activeSession', null); stopRest();
    const after = computeRecords(await dbAll('workouts'));
    const newPR = Object.keys(after).filter(k => !records[k] || after[k].e1rm > records[k].e1rm).length;
    openSheet(`<div style="text-align:center;padding:10px 0"><div style="font-size:56px">🔥</div><h2>Séance terminée !</h2>
      <div class="muted">${doneSets} séries · ${w.duration} min${newPR ? ` · <span class="pr">${newPR} record${newPR > 1 ? 's' : ''} battu${newPR > 1 ? 's' : ''}</span>` : ''}</div>
      <div class="quote" style="margin-top:14px">${esc(quoteOfDay())}</div>
      <button class="btn primary block" style="margin-top:18px" id="fin-ok">Retour</button></div>`);
    $('#fin-ok').onclick = () => { closeSheet(); go('home'); };
    toast('+100 XP 💪', 2500);
  };
}

function startRest(sec) { restTimer = { end: Date.now() + sec * 1000, iv: restTimer && restTimer.iv }; if (!restTimer.iv) restTimer.iv = setInterval(renderTimer, 500); renderTimer(); }
function stopRest() { if (restTimer && restTimer.iv) clearInterval(restTimer.iv); restTimer = null; const s = $('#timer-slot'); if (s) s.innerHTML = ''; }
function renderTimer() {
  const slot = $('#timer-slot'); if (!slot || !restTimer) { if (!slot && restTimer) { clearInterval(restTimer.iv); restTimer = null; } return; }
  const left = Math.ceil((restTimer.end - Date.now()) / 1000);
  if (left <= 0) { stopRest(); navigator.vibrate && navigator.vibrate([300, 120, 300]); toast('⏱️ Repos terminé, série suivante !'); return; }
  slot.innerHTML = `<div class="timer"><span>Repos ⏱️ ${Math.floor(left / 60)}:${pad(left % 60)}</span>
    <span class="row" style="gap:6px"><button class="btn sm" id="t-plus">+30s</button><button class="btn sm" id="t-skip">Passer</button></span></div>`;
  $('#t-plus').onclick = () => { restTimer.end += 30000; renderTimer(); };
  $('#t-skip').onclick = stopRest;
}

function weeklyAverages(body) {
  const w = {};
  body.filter(b => b.weight != null).forEach(b => { const k = dateKey(weekStart(parseKey(b.date))); (w[k] = w[k] || []).push(b.weight); });
  return Object.entries(w).sort((a, b) => b[0].localeCompare(a[0])).map(([k, v]) => ({ week: k, avg: v.reduce((a, b) => a + b, 0) / v.length, n: v.length }));
}

      <div class="small muted" style="margin-top:10px">Écarts calculés depuis ta 1re mesure Basic-Fit. Ne compare pas Basic-Fit et InBody entre eux : ce sont deux appareils différents.</div></div>

    ${avgs.length ? `<div class="card"><h2>Moyenne de poids par semaine</h2>
      ${avgs.map((w, i) => { const prev = avgs[i + 1]; const d = prev ? r1(w.avg - prev.avg) : null;
        return `<div class="list-row"><span>Semaine du ${fmtShort(w.week)} <span class="small muted">(${w.n} pesée${w.n > 1 ? 's' : ''})</span></span><span><b>${r1(w.avg)} kg</b>${d != null ? ` <span class="small" style="color:${d <= 0 ? 'var(--good)' : 'var(--accent2)'}">${d > 0 ? '+' : ''}${d}</span>` : ''}</span></div>`; }).join('')}
      <div class="small muted" style="margin-top:8px">En phase 2, vise −0,25 à −0,5 kg par semaine. Si la moyenne stagne 2 semaines, enlève une portion de féculents par jour.</div></div>` : ''}

    <div class="card"><h2>Poids</h2>${lineChart(wPts, { target: goals.targetWeight ?? null, unit: ' kg' })}</div>
    ${fatPts.length >= 2 ? `<div class="card"><h2>Masse grasse (Basic-Fit)</h2>${lineChart(fatPts, { target: goals.targetBF ?? null, unit: ' %' })}</div>` : ''}
    ${waistPts.length >= 2 ? `<div class="card"><h2>Tour de taille</h2>${lineChart(waistPts, { unit: ' cm' })}</div>` : ''}

    : `<div class="empty"><div class="big">📏</div>Aucune mesure pour l'instant.<br>Appuie sur <b>+</b> après ta pesée Basic-Fit.</div>`);
  view().querySelectorAll('.brow').forEach(r => r.onclick = () => bodySheet(body.find(b => b.id === r.dataset.id)));

function bodySheet(entry) {
  const isNew = !entry;
  const b = entry ? { ...entry } : { id: uid(), date: dateKey(), ts: Date.now(), source: 'Basic-Fit' };
  let photo = b.photo || null;
  let source = b.source || 'Basic-Fit';
  openSheet(`<h2>${isNew ? 'Nouvelle mesure' : 'Mesure'}</h2>
    <div class="small muted">Recopie ce qu'affiche la balance Basic-Fit. Laisse vide ce qu'elle ne donne pas.</div>
    <label>Source</label><div class="seg" id="b-src">${SOURCES.map(s => `<button data-v="${s}" class="${s === source ? 'on' : ''}">${s}</button>`).join('')}</div>
    <label>Date</label><input type="date" id="b-date" value="${b.date}">
    <div class="grid2">${BODY_FIELDS.map(([k, l, u]) => `<div><label>${l}${u === 'indice' ? '' : ` (${u})`}</label><input id="b-${k}" inputmode="decimal" value="${b[k] ?? ''}"></div>`).join('')}</div>
    <label>Note</label><input id="b-note" value="${esc(b.note || '')}" placeholder="ex. avant la séance, après le repas...">
    <input type="file" id="b-file" accept="image/*" capture="environment" hidden>
    <img id="b-prev" class="photo-preview" ${photo ? `src="${blobURL(photo)}"` : 'hidden'} alt="">
    <button class="btn block" id="b-cam" style="margin-top:10px">📷 Photo de progression (ou de l'écran de la balance)</button>
    <div class="sheet-actions">${isNew ? `<button class="btn ghost" id="b-cancel">Annuler</button>` : `<button class="btn danger" id="b-del">Supprimer</button>`}
      <button class="btn primary" id="b-save">Enregistrer</button></div>`);
  document.querySelectorAll('#b-src button').forEach(x => x.onclick = () => { source = x.dataset.v; document.querySelectorAll('#b-src button').forEach(y => y.classList.toggle('on', y === x)); });
  $('#b-cam').onclick = () => $('#b-file').click();
  $('#b-file').onchange = async () => { const f = $('#b-file').files[0]; if (!f) return; photo = await resizeImage(f); const p = $('#b-prev'); p.src = blobURL(photo); p.hidden = false; };
  $('#b-save').onclick = async () => {
    b.date = $('#b-date').value || dateKey(); b.source = source;
    BODY_FIELDS.forEach(([k]) => { b[k] = num($('#b-' + k).value); });
    b.note = $('#b-note').value.trim(); b.photo = photo;
    if (BODY_FIELDS.every(([k]) => b[k] == null) && !photo) { toast('Entre au moins une valeur.'); return; }
    await dbPut('body', b); closeSheet(); toast('Mesure enregistrée ✓'); go('body');
  };
  if (isNew) $('#b-cancel').onclick = closeSheet;
  else $('#b-del').onclick = async () => { if (await confirmSheet('Supprimer cette mesure ?', 'Supprimer')) { await dbDel('body', b.id); go('body'); } };
}

const PROGRAM_EXAMPLE = `{
  "nom": "Programme Hicham — Phase 1",
  "description": "Exemple de format",
  "seancesParSemaine": 3,
  "jours": [
    { "nom": "Haut du corps",
      "exercices": [
        { "nom": "Développé couché", "series": 4, "reps": "8-10", "repos": 120, "conseil": "Omoplates serrées" },
        { "nom": "Tractions", "series": 3, "reps": "max", "repos": 90 }
      ] }
  ]
}`;

function validateProgram(p) {
  if (!p || typeof p !== 'object') throw new Error('Le programme doit être un objet JSON.');
  if (!Array.isArray(p.jours) || !p.jours.length) throw new Error('Il manque la liste "jours".');
  p.jours.forEach((j, i) => {
    if (!j.nom) throw new Error(`Le jour n°${i + 1} n'a pas de "nom".`);
    if (!Array.isArray(j.exercices) || !j.exercices.length) throw new Error(`Le jour "${j.nom}" n'a pas d'"exercices".`);
    j.exercices.forEach(e => { if (!e.nom) throw new Error(`Un exercice du jour "${j.nom}" n'a pas de "nom".`); });
  });
  return p;
}

/* ---------------- Sauvegarde / restauration ---------------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
const dataURLToBlob = async u => (await fetch(u)).blob();

async function exportBackup() {
  toast('Préparation de la sauvegarde...', 8000);
  const parts = [`{"app":"summerbody","version":1,"exportedAt":"${new Date().toISOString()}"`];
  for (const store of STORES) {
    const rows = await dbAll(store);
    parts.push(`,"${store}":[`);
    for (let i = 0; i < rows.length; i++) {
      const r = { ...rows[i] };
      if (r.photo instanceof Blob) r.photo = await blobToDataURL(r.photo);
      parts.push((i ? ',' : '') + JSON.stringify(r));
    }
    parts.push(']');
  }
  parts.push('}');
  const blob = new Blob(parts, { type: 'application/json' });
  const name = `summerbody-sauvegarde-${dateKey()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('Sauvegarde exportée ✓'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { toast('Export annulé'); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('Sauvegarde téléchargée ✓ (' + Math.round(blob.size / 1e6) + ' Mo)');
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('Fichier illisible.'); return; }
  if (!data || data.app !== 'summerbody') { toast("Ce fichier n'est pas une sauvegarde Summer Body."); return; }
  const n = (data.meals || []).length + (data.workouts || []).length + (data.body || []).length;
  if (!(await confirmSheet(`Remplacer toutes les données actuelles par cette sauvegarde (${n} éléments) ?`, 'Restaurer'))) return;
  toast('Restauration...', 8000);
  for (const store of STORES) {
    await dbClear(store);
    for (const r of data[store] || []) {
      if (typeof r.photo === 'string' && r.photo.startsWith('data:')) r.photo = await dataURLToBlob(r.photo);
      await dbPut(store, r);
    }
  }
  toast('Sauvegarde restaurée ✓'); go('home');
}

  go('home');
})();
